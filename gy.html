<style>/*文字替换&背景*/
        @font-face{
          font-family: "fontnamegular";
          src: url(chineseblack.ttf);
        }
        body {
          font-family:"fontnamegular";
  }
  body{
    position: relative;
    margin: 0;
    min-height: 100vh;
  }
  body::before{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("/background/back3.jpg");
    background-size: cover;
    z-index: -1;
  }

  </style>
<style>
.fly{
      font-size: 20px;
      color: pink;
    }
.backgroud{
    position: relative;
    z-index: 2; 
    padding: 2rem;
    color: rgb(0, 0, 0);
    text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
    background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(3px);
        }
.blur-box {
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    backdrop-filter: blur(10px); 
    
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);

    width: 600px;
    padding: 20px;
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    user-select: none;
}
.title{
  position: fixed;
  top:10%;
  left:50%;
  user-select: none;
  
  
}
.blur-box-1{
    background: rgba(255, 255, 255, 0.3);

    width: 600px;
    padding: 20px;
    position: absolute;
    left: 50%;
    top: 600px;
    transform: translate(-50%, -50%);
    user-select: none;

}
.blur-box p {
    color: #333;
    margin: 0;
    font-size: 1.2rem;
    line-height: 1.6;
}
.fade-in {
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

.fade-in.active {
  opacity: 1;

}
</style>
