<style>/*导航*/
      .nav-column {
          position: absolute;
          left: 0;
          top: 50%;
          transform: translateY(-50%);
          width: 40px;
          height: 150px;/*导航宽度*/
          background: rgba(255, 255, 255, 0.3);
          backdrop-filter: blur(15px);
          -webkit-backdrop-filter: blur(15px);
          border-radius: 0 15px 15px 0;
          transition: all 0.3s ease;
          z-index: 1000;
          cursor: pointer;
          overflow: hidden;
      }
      .nav-trigger-bar {
          position: absolute;
          width: 100%;
          height: 2px;
          background: pink;
          transition: all 0.3s ease;
      }
      .nav-column:hover,
      .nav-column.active {
          width: 160px;
      }
      /* 导航内容 */
      .nav-content {
          opacity: 0;
          visibility: hidden;
          position: absolute;
          left: 40px;
          top: 20px;
          width: 120px;
          max-width: calc(100% - 0px); 
          transition: all 0.3s ease;
      }

      .nav-column.active .nav-content,
      .nav-column:hover .nav-content {
          opacity: 1;
          visibility: visible;
      }

      .nav-list {
          list-style: none;
          padding: 0;
          margin: 0;
          max-width: calc(100% - 0px);
          width: 100%; 
      }

      .nav-item {
          margin: 15px 0;
      }

      /* 原有内容适配 */
      .title {
          margin-left: 60px; /* 给导航栏留出空间 */
          transition: margin 0.3s ease;
      }
      /* 移动端优化 */
      @media (max-width: 768px) {
          .nav-column {
              top: auto;
              bottom: 20px;
              transform: none;
          }
          .nav-column.active {
              width: 160px;
              height: auto;
              padding: 20px 0;
          }
          .nav-content {
              left: 35px;
              top: 15px;
          }
      }
  </style>

<script>
  window.onload = function() {
    const element = document.querySelector('.fade-in');
    element.classList.add('active');
  };
  </script>

   <script>/*导航*/
    // 导航栏交互逻辑
    const navColumn = document.querySelector('.nav-column');
    
    // 点击切换
    navColumn.addEventListener('click', function() {
        this.classList.toggle('active');
    });

    // 窗口尺寸适配
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            navColumn.classList.remove('active');
        }
    });
</script>
