<style>/*导航*/
      .nav-column {
          position: absolute;
          left: 0;
          top: 50%;
          transform: translateY(-50%);
          width: 40px;
          height: 150px;/*导航宽度*/
          background: rgba(255, 255, 255, 0.3);
          backdrop-filter: blur(15px);
          -webkit-backdrop-filter: blur(15px);
          border-radius: 0 15px 15px 0;
          transition: all 0.3s ease;
          z-index: 1000;
          cursor: pointer;
          overflow: hidden;
          user-select: none;
      }
      .nav-trigger-bar {
          position: absolute;
          width: 100%;
          height: 2px;
          background: pink;
          transition: all 0.3s ease;
      }
      .nav-column:hover,
      .nav-column.active {
          width: 160px;
      }
      /* 导航内容 */
      .nav-content {
          opacity: 0;
          visibility: hidden;
          position: absolute;
          left: 40px;
          top: 20px;
          width: 120px;
          max-width: calc(100% - 0px); 
          transition: all 0.3s ease;
      }

      .nav-column.active .nav-content,
      .nav-column:hover .nav-content {
          opacity: 1;
          visibility: visible;
      }

      .nav-list {
          list-style: none;
          padding: 0;
          margin: 0;
          max-width: calc(100% - 0px);
          width: 100%; 
      }

      .nav-item {
          margin: 15px 0;
      }

      /* 原有内容适配 */
      .title {
          margin-left: 60px;
          transition: margin 0.3s ease;
          user-select: none;
      }
  </style>
